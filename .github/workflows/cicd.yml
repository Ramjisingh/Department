name: Spring Boot CI/CD on Windows

on:
  push:
    branches: [ develop, master ]          # Trigger CI on develop pushes
  pull_request:
    branches: [ master ]             # Trigger CI for PRs targeting main
  workflow_dispatch:               # Manual trigger if needed

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: userdb
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        shell: pwsh
        run: mvn clean install -DskipTests

      - name: Run tests
        shell: pwsh
        run: mvn test

  docker-build-and-push:
    needs: build-and-test
    if: github.ref == 'refs/heads/master'   # Only deploy on main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Verify JAR
        run: ls -la target

      - name: Build Docker image
        shell: pwsh
        run: docker build -t ramjiyadav/ramjihub/my-dept-spring-boot-app:latest .

      - name: Push Docker image
        shell: pwsh
        run: docker push ramjiyadav/ramjihub/my-dept-spring-boot-app:latest
